version: '3.8'

# Complete microservices deployment with separate databases
services:
  # Auth Service Database
  auth-postgres:
    image: postgres:15
    container_name: auth-postgres
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: auth_user
      POSTGRES_PASSWORD: auth_password
    ports:
      - "5433:5432"
    volumes:
      - auth_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth_user -d auth_db"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - microservices-network

  # Gateway Service Database
  gateway-postgres:
    image: postgres:15
    container_name: gateway-postgres
    environment:
      POSTGRES_DB: gateway_db
      POSTGRES_USER: gateway_user
      POSTGRES_PASSWORD: gateway_password
    ports:
      - "5434:5432"
    volumes:
      - gateway_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gateway_user -d gateway_db"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - microservices-network

  # Auth Service Redis
  auth-redis:
    image: redis:7-alpine
    container_name: auth-redis
    ports:
      - "6380:6379"
    volumes:
      - auth_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - microservices-network

  # Gateway Service Redis
  gateway-redis:
    image: redis:7-alpine
    container_name: gateway-redis
    ports:
      - "6381:6379"
    volumes:
      - gateway_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - microservices-network

  # Auth Service
  auth-service:
    build:
      context: ./src/auth_service
      dockerfile: Dockerfile
    container_name: auth-service
    expose:
      - "8001"
    environment:
      - AUTH_DATABASE_URL=postgresql://auth_user:auth_password@auth-postgres:5432/auth_db
      - AUTH_REDIS_URL=redis://auth-redis:6379/1
      - JWT_SECRET_KEY=auth_service_production_secret_key_change_this
      - ENVIRONMENT=production
      - DEBUG=false
    depends_on:
      auth-postgres:
        condition: service_healthy
      auth-redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - microservices-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Auth Service Nginx Reverse Proxy
  auth-nginx:
    build:
      context: ./src/auth_service/nginx
      dockerfile: Dockerfile
    container_name: auth-nginx
    ports:
      - "8443:443"
      - "8080:80"
    environment:
      - ENVIRONMENT=production
    depends_on:
      auth-service:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - auth_nginx_certs:/etc/nginx/certs
      - auth_nginx_logs:/var/log/nginx
    networks:
      - microservices-network

  # API Gateway
  api-gateway:
    build:
      context: ./src/api-gateway
      dockerfile: Dockerfile
    container_name: api-gateway
    ports:
      - "8000:8000"
    environment:
      - GATEWAY_DATABASE_URL=postgresql://gateway_user:gateway_password@gateway-postgres:5432/gateway_db
      - GATEWAY_REDIS_URL=redis://gateway-redis:6379/0
      - AUTH_SERVICE_URL=http://auth-service:8001
      - ENVIRONMENT=production
      - DEBUG=false
    depends_on:
      gateway-postgres:
        condition: service_healthy
      gateway-redis:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - microservices-network

volumes:
  auth_postgres_data:
  gateway_postgres_data:
  auth_redis_data:
  gateway_redis_data:
  auth_nginx_certs:
  auth_nginx_logs:

networks:
  microservices-network:
    driver: bridge