version: '3.8'

# Development overrides for docker-compose.yml
# Usage: docker-compose -f docker-compose.yml -f docker-compose.dev.yml up

services:
  auth-service:
    environment:
      - DEBUG=true
      - LOG_LEVEL=DEBUG
      - RELOAD=true
    volumes:
      - ../../services/auth-service:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8001 --reload

  api-gateway:
    environment:
      - DEBUG=true
      - LOG_LEVEL=DEBUG
      - RELOAD=true
    volumes:
      - ../../services/api-gateway:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  # Development databases with exposed ports for local access
  auth-postgres:
    environment:
      - POSTGRES_DB=auth_db_dev
    volumes:
      - auth_postgres_dev_data:/var/lib/postgresql/data

  gateway-postgres:
    environment:
      - POSTGRES_DB=gateway_db_dev
    volumes:
      - gateway_postgres_dev_data:/var/lib/postgresql/data

  # Adminer for database management in development
  adminer:
    image: adminer:latest
    container_name: munshi-adminer
    ports:
      - "8080:8080"
    networks:
      - munshi-network
    restart: unless-stopped

  # Redis Commander for Redis management in development
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: munshi-redis-commander
    environment:
      - REDIS_HOSTS=auth-redis:auth-redis:6379:1,gateway-redis:gateway-redis:6379:0
    ports:
      - "8081:8081"
    depends_on:
      - auth-redis
      - gateway-redis
    networks:
      - munshi-network
    restart: unless-stopped

volumes:
  auth_postgres_dev_data:
  gateway_postgres_dev_data: