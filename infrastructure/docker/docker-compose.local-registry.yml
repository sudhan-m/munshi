version: '3.8'

services:
  registry:
    image: registry:2
    container_name: local-registry
    ports:
      - "5001:5000"
    volumes:
      - registry-data:/var/lib/registry
    environment:
      REGISTRY_STORAGE_FILESYSTEM_ROOTDIRECTORY: /var/lib/registry
    restart: unless-stopped
    networks:
      - registry-network

volumes:
  registry-data:

networks:
  registry-network:
    driver: bridge