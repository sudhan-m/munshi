version: '3.8'

services:
  # PostgreSQL databases
  auth-postgres:
    image: postgres:15
    container_name: munshi-auth-postgres
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: auth_user
      POSTGRES_PASSWORD: auth_password
    ports:
      - "5433:5432"
    volumes:
      - auth_postgres_data:/var/lib/postgresql/data
    networks:
      - munshi-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth_user -d auth_db"]
      interval: 30s
      timeout: 10s
      retries: 3

  gateway-postgres:
    image: postgres:15
    container_name: munshi-gateway-postgres
    environment:
      POSTGRES_DB: gateway_db
      POSTGRES_USER: gateway_user
      POSTGRES_PASSWORD: gateway_password
    ports:
      - "5434:5432"
    volumes:
      - gateway_postgres_data:/var/lib/postgresql/data
    networks:
      - munshi-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gateway_user -d gateway_db"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Redis instances
  auth-redis:
    image: redis:7-alpine
    container_name: munshi-auth-redis
    command: redis-server --appendonly yes --databases 16
    ports:
      - "6380:6379"
    volumes:
      - auth_redis_data:/data
    networks:
      - munshi-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  gateway-redis:
    image: redis:7-alpine
    container_name: munshi-gateway-redis
    command: redis-server --appendonly yes --databases 16
    ports:
      - "6381:6379"
    volumes:
      - gateway_redis_data:/data
    networks:
      - munshi-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Authentication Service
  auth-service:
    build:
      context: ../../services/auth-service
      dockerfile: Dockerfile
    container_name: munshi-auth-service
    environment:
      - ENVIRONMENT=development
      - SERVICE_NAME=auth-service
      - DATABASE_URL=postgresql://auth_user:auth_password@auth-postgres:5432/auth_db
      - REDIS_URL=redis://auth-redis:6379/1
      - JWT_SECRET_KEY=your-super-secret-jwt-key-change-in-production
      - ACCESS_TOKEN_EXPIRE_MINUTES=30
      - LOG_LEVEL=INFO
      - HOST=0.0.0.0
      - PORT=8001
    ports:
      - "8001:8001"
    depends_on:
      auth-postgres:
        condition: service_healthy
      auth-redis:
        condition: service_healthy
    networks:
      - munshi-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # API Gateway
  api-gateway:
    build:
      context: ../../services/api-gateway
      dockerfile: Dockerfile
    container_name: munshi-api-gateway
    environment:
      - ENVIRONMENT=development
      - SERVICE_NAME=api-gateway
      - DATABASE_URL=postgresql://gateway_user:gateway_password@gateway-postgres:5432/gateway_db
      - REDIS_URL=redis://gateway-redis:6379/0
      - AUTH_SERVICE_URL=http://auth-service:8001
      - HOST=0.0.0.0
      - PORT=8000
      - RATE_LIMIT_REQUESTS_PER_MINUTE=1000
    ports:
      - "8000:8000"
    depends_on:
      gateway-postgres:
        condition: service_healthy
      gateway-redis:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    networks:
      - munshi-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Caddy Reverse Proxy
  caddy:
    image: caddy:2-alpine
    container_name: munshi-caddy
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api-gateway
    networks:
      - munshi-network
    restart: unless-stopped

volumes:
  auth_postgres_data:
  gateway_postgres_data:
  auth_redis_data:
  gateway_redis_data:
  caddy_data:
  caddy_config:

networks:
  munshi-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16