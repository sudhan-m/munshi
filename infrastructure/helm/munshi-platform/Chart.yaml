apiVersion: v2
name: munshi-platform
description: A Helm chart for the Munshi Language Learning Platform
type: application
version: 1.0.0
appVersion: "1.0.0"

maintainers:
  - name: Munshi Team
    email: team@munshi.dev

keywords:
  - language-learning
  - ai
  - speech-recognition
  - microservices

home: https://github.com/munshi/munshi-platform
sources:
  - https://github.com/munshi/munshi-platform

dependencies:
  - name: redis
    version: 17.11.3
    repository: https://charts.bitnami.com/bitnami
    condition: redis.enabled
  - name: postgresql
    version: 12.5.8
    repository: https://charts.bitnami.com/bitnami
    condition: postgresql.enabled
  - name: cert-manager
    version: v1.13.1
    repository: https://charts.jetstack.io
    condition: certManager.install