apiVersion: v2
name: munshi-platform
description: A Helm chart for the Munshi Language Learning Platform
type: application
version: 1.0.0
appVersion: "1.0.0"

maintainers:
  - name: Munshi Team
    email: team@munshi.dev

keywords:
  - language-learning
  - ai
  - speech-recognition
  - microservices

home: https://github.com/munshi/munshi-platform
sources:
  - https://github.com/munshi/munshi-platform

# Dependencies for complete platform deployment
# Using older Bitnami chart versions with working images
dependencies:
  - name: redis
    version: 19.6.4
    repository: https://charts.bitnami.com/bitnami
    condition: redis.enabled
  - name: postgresql
    version: 15.5.28
    repository: https://charts.bitnami.com/bitnami
    condition: postgresql.enabled
  - name: mongodb
    version: 15.6.24
    repository: https://charts.bitnami.com/bitnami
    condition: mongodb.enabled