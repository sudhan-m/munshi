{{- if .Values.services.conversationService.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.services.conversationService.name }}
  labels:
    {{- include "munshi-platform.serviceLabels" (dict "serviceName" "conversation-service" "root" .) | nindent 4 }}
spec:
  replicas: {{ .Values.services.conversationService.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "munshi-platform.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: conversation-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "munshi-platform.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: conversation-service
    spec:
      serviceAccountName: {{ include "munshi-platform.serviceAccountName" . }}
      securityContext:
        {{- include "munshi-platform.podSecurityContext" . | nindent 8 }}
      containers:
        - name: conversation-service
          securityContext:
            {{- include "munshi-platform.securityContext" . | nindent 12 }}
          image: {{ include "munshi-platform.image" (dict "service" .Values.services.conversationService "root" .) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.services.conversationService.targetPort }}
              protocol: TCP
          env:
            {{- include "munshi-platform.commonEnv" . | nindent 12 }}
            {{- range .Values.services.conversationService.env }}
            - name: {{ .name }}
              {{- if .value }}
              value: {{ .value | quote }}
              {{- else if .valueFrom }}
              valueFrom:
                {{- toYaml .valueFrom | nindent 16 }}
              {{- end }}
            {{- end }}
          {{- include "munshi-platform.livenessProbe" . | nindent 10 }}
          {{- include "munshi-platform.readinessProbe" . | nindent 10 }}
          {{- include "munshi-platform.resources" (dict "service" .Values.services.conversationService "root" .) | nindent 10 }}
      {{- include "munshi-platform.nodeSelector" (dict "service" .Values.services.conversationService "root" .) | nindent 6 }}
      {{- include "munshi-platform.tolerations" (dict "service" .Values.services.conversationService "root" .) | nindent 6 }}
      {{- include "munshi-platform.affinity" (dict "service" .Values.services.conversationService "root" .) | nindent 6 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.services.conversationService.name }}
  labels:
    {{- include "munshi-platform.serviceLabels" (dict "serviceName" "conversation-service" "root" .) | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.services.conversationService.port }}
      targetPort: {{ .Values.services.conversationService.targetPort }}
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: {{ include "munshi-platform.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: conversation-service
{{- end }}