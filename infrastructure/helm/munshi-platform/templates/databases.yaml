---
# PostgreSQL StatefulSet with official image
apiVersion: v1
kind: Service
metadata:
  name: munshi-platform-postgresql
  namespace: {{ .Release.Namespace }}
  labels:
    app: postgresql
spec:
  ports:
    - port: 5432
      name: postgres
  clusterIP: None
  selector:
    app: postgresql
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: munshi-platform-postgresql
  namespace: {{ .Release.Namespace }}
spec:
  serviceName: munshi-platform-postgresql
  replicas: 1
  selector:
    matchLabels:
      app: postgresql
  template:
    metadata:
      labels:
        app: postgresql
    spec:
      nodeSelector:
        workload-type: database
      tolerations:
        - key: workload-type
          operator: Equal
          value: database
          effect: NoSchedule
      containers:
      - name: postgresql
        image: postgres:16-alpine
        ports:
        - containerPort: 5432
          name: postgres
        env:
        - name: POSTGRES_DB
          value: "munshi_auth"
        - name: POSTGRES_USER
          value: "munshi_user"
        - name: POSTGRES_PASSWORD
          value: "munshi_password"
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        volumeMounts:
        - name: postgres-storage
          mountPath: /var/lib/postgresql/data
        resources:
          limits:
            cpu: 300m
            memory: 512Mi
          requests:
            cpu: 100m
            memory: 256Mi
  volumeClaimTemplates:
  - metadata:
      name: postgres-storage
    spec:
      accessModes: [ "ReadWriteOnce" ]
      storageClassName: standard-rwo
      resources:
        requests:
          storage: 10Gi
---
# MongoDB StatefulSet with official image
apiVersion: v1
kind: Service
metadata:
  name: munshi-platform-mongodb
  namespace: {{ .Release.Namespace }}
  labels:
    app: mongodb
spec:
  ports:
    - port: 27017
      name: mongo
  clusterIP: None
  selector:
    app: mongodb
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: munshi-platform-mongodb
  namespace: {{ .Release.Namespace }}
spec:
  serviceName: munshi-platform-mongodb
  replicas: 1
  selector:
    matchLabels:
      app: mongodb
  template:
    metadata:
      labels:
        app: mongodb
    spec:
      nodeSelector:
        workload-type: database
      tolerations:
        - key: workload-type
          operator: Equal
          value: database
          effect: NoSchedule
      containers:
      - name: mongodb
        image: mongo:8.0
        ports:
        - containerPort: 27017
          name: mongo
        env:
        - name: MONGO_INITDB_ROOT_USERNAME
          value: "root"
        - name: MONGO_INITDB_ROOT_PASSWORD
          value: "mongodb123"
        - name: MONGO_INITDB_DATABASE
          value: "munshi"
        volumeMounts:
        - name: mongo-storage
          mountPath: /data/db
        resources:
          limits:
            cpu: 300m
            memory: 512Mi
          requests:
            cpu: 100m
            memory: 256Mi
  volumeClaimTemplates:
  - metadata:
      name: mongo-storage
    spec:
      accessModes: [ "ReadWriteOnce" ]
      storageClassName: standard-rwo
      resources:
        requests:
          storage: 10Gi
---
# Redis Deployment with official image
apiVersion: v1
kind: Service
metadata:
  name: munshi-platform-redis-master
  namespace: {{ .Release.Namespace }}
  labels:
    app: redis
spec:
  ports:
    - port: 6379
      name: redis
  selector:
    app: redis
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: munshi-platform-redis
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      nodeSelector:
        workload-type: database
      tolerations:
        - key: workload-type
          operator: Equal
          value: database
          effect: NoSchedule
      containers:
      - name: redis
        image: redis:7.4-alpine
        command: ["redis-server"]
        args: ["--requirepass", "redis123"]
        ports:
        - containerPort: 6379
          name: redis
        resources:
          limits:
            cpu: 200m
            memory: 256Mi
          requests:
            cpu: 50m
            memory: 128Mi
