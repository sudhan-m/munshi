{{- if and .Values.secrets (.Values.createSecrets | default false) }}
{{- range $name, $secret := .Values.secrets }}
{{- if and (kindIs "map" $secret) (hasKey $secret "type") (hasKey $secret "data") }}
{{/* Handle structured secrets with type and data fields */}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "munshi-platform.labels" $ | nindent 4 }}
type: {{ $secret.type | default "Opaque" }}
data:
  {{- range $key, $value := $secret.data }}
  {{ $key }}: {{ $value | b64enc | quote }}
  {{- end }}
---
{{- end }}
{{- end }}
{{- end }}