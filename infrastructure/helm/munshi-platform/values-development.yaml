# Development environment overrides
environment: development

# Development ingress with local domain and self-signed certificates
ingress:
  enabled: true
  className: "nginx"
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    cert-manager.io/cluster-issuer: "selfsigned-issuer"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_set_headers "X-Frame-Options: DENY";
      more_set_headers "X-Content-Type-Options: nosniff";
      more_set_headers "X-XSS-Protection: 1; mode=block";
  hosts:
    - host: munshi.local
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: munshi-dev-tls
      hosts:
        - munshi.local

# Reduced replicas for development
services:
  authService:
    replicas: 1
    resources:
      limits:
        cpu: 200m
        memory: 128Mi
      requests:
        cpu: 50m
        memory: 64Mi

  audioService:
    replicas: 1
    resources:
      limits:
        cpu: 300m
        memory: 256Mi
      requests:
        cpu: 100m
        memory: 128Mi

  asrService:
    replicas: 1
    resources:
      limits:
        cpu: 1000m
        memory: 2Gi
      requests:
        cpu: 500m
        memory: 1Gi
    env:
      - name: CLOUD_RUN_MODE
        value: "false"
      - name: GPU_SUPPORT
        value: "cpu"
      - name: MODEL_CACHE_SIZE
        value: "1"

  conversationService:
    replicas: 1
    resources:
      limits:
        cpu: 200m
        memory: 128Mi
      requests:
        cpu: 50m
        memory: 64Mi

  llmService:
    replicas: 1
    resources:
      limits:
        cpu: 500m
        memory: 512Mi
      requests:
        cpu: 200m
        memory: 256Mi

  pronunciationEvaluator:
    replicas: 1
    resources:
      limits:
        cpu: 300m
        memory: 256Mi
      requests:
        cpu: 100m
        memory: 128Mi

  uiService:
    replicas: 1
    resources:
      limits:
        cpu: 100m
        memory: 128Mi
      requests:
        cpu: 25m
        memory: 32Mi

# Development database configuration
postgresql:
  enabled: true
  auth:
    postgresPassword: "dev123"
    database: "munshi_dev"
  primary:
    persistence:
      enabled: false  # Use ephemeral storage in development
  architecture: standalone

# Development Redis configuration
redis:
  enabled: true
  auth:
    enabled: false  # Disable auth for development
  master:
    persistence:
      enabled: false  # Use ephemeral storage in development

# Disable autoscaling in development
autoscaling:
  enabled: false

# Disable pod disruption budget in development
podDisruptionBudget:
  enabled: false

# Development secrets (base64 encoded)
secrets:
  databaseCredentials:
    type: Opaque
    data:
      auth-db-url: "postgresql://postgres:dev123@postgresql-primary:5432/munshi_dev"
      audio-db-url: "postgresql://postgres:dev123@postgresql-primary:5432/munshi_dev"
      conversation-db-url: "postgresql://postgres:dev123@postgresql-primary:5432/munshi_dev"
      
  redisCredentials:
    type: Opaque
    data:
      redis-url: "redis://redis-master:6379"
      
  authSecrets:
    type: Opaque
    data:
      jwt-secret: "dev-jwt-secret-key"
      
  llmSecrets:
    type: Opaque
    data:
      google-api-key: ""  # Set during deployment
      openai-api-key: ""  # Set during deployment

# Development logging
logging:
  level: DEBUG
  format: text

# Cert-manager configuration for development
certManager:
  enabled: true
  email: dev@munshi.dev