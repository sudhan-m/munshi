# Staging environment overrides
environment: staging

# Staging ingress
ingress:
  enabled: true
  className: "nginx"
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    cert-manager.io/cluster-issuer: "letsencrypt-staging"
  hosts:
    - host: staging.munshi.app
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: munshi-staging-tls
      hosts:
        - staging.munshi.app

# Staging replicas (smaller than production)
services:
  authService:
    replicas: 2
    resources:
      limits:
        cpu: 400m
        memory: 384Mi
      requests:
        cpu: 150m
        memory: 192Mi

  audioService:
    replicas: 2
    resources:
      limits:
        cpu: 700m
        memory: 768Mi
      requests:
        cpu: 300m
        memory: 384Mi

  asrService:
    replicas: 1
    resources:
      limits:
        cpu: 2000m
        memory: 4Gi
      requests:
        cpu: 1000m
        memory: 2Gi
    env:
      - name: CLOUD_RUN_MODE
        value: "false"
      - name: GPU_SUPPORT
        value: "cpu"
      - name: MODEL_CACHE_SIZE
        value: "2"

  conversationService:
    replicas: 2
    resources:
      limits:
        cpu: 400m
        memory: 384Mi
      requests:
        cpu: 150m
        memory: 192Mi

  llmService:
    replicas: 2
    resources:
      limits:
        cpu: 1500m
        memory: 1.5Gi
      requests:
        cpu: 750m
        memory: 768Mi

  pronunciationEvaluator:
    replicas: 2
    resources:
      limits:
        cpu: 700m
        memory: 768Mi
      requests:
        cpu: 300m
        memory: 384Mi

  uiService:
    replicas: 2
    resources:
      limits:
        cpu: 200m
        memory: 384Mi
      requests:
        cpu: 75m
        memory: 96Mi

# Staging database configuration
postgresql:
  enabled: true
  auth:
    postgresPassword: "staging123"
    database: "munshi_staging"
  primary:
    persistence:
      enabled: true
      size: 4Gi
  architecture: standalone

# Staging Redis configuration
redis:
  enabled: true
  auth:
    enabled: true
    password: "staging123"
  master:
    persistence:
      enabled: true
      size: 1Gi

# Limited autoscaling in staging
autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 85

# Enable pod disruption budget in staging
podDisruptionBudget:
  enabled: true
  minAvailable: 1

# Staging secrets (base64 encoded)
secrets:
  databaseCredentials:
    type: Opaque
    data:
      auth-db-url: "postgresql://postgres:staging123@postgresql-primary:5432/munshi_staging"
      audio-db-url: "postgresql://postgres:staging123@postgresql-primary:5432/munshi_staging"
      conversation-db-url: "postgresql://postgres:staging123@postgresql-primary:5432/munshi_staging"
      
  redisCredentials:
    type: Opaque
    data:
      redis-url: "redis://:staging123@redis-master:6379"
      
  authSecrets:
    type: Opaque
    data:
      jwt-secret: "staging-jwt-secret-key-should-be-strong"
      
  llmSecrets:
    type: Opaque
    data:
      google-api-key: ""  # Set during deployment
      openai-api-key: ""  # Set during deployment

# Staging logging
logging:
  level: INFO
  format: json

# Basic monitoring in staging
monitoring:
  enabled: true
  serviceMonitor:
    enabled: false  # Disable detailed monitoring in staging

# Cert-manager configuration for staging
certManager:
  enabled: true
  email: staging@munshi.dev