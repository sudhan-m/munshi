apiVersion: v1
kind: ServiceAccount
metadata:
  name: auth-service
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "munshi.authServiceLabels" . | nindent 4 }}

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "munshi.authServiceLabels" . | nindent 4 }}
  annotations:
    {{- include "munshi.linkerdAnnotations" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount.authService }}
  selector:
    matchLabels:
      app: auth-service
      {{- include "munshi.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        app: auth-service
        version: v1
        {{- include "munshi.authServiceLabels" . | nindent 8 }}
      annotations:
        {{- include "munshi.linkerdAnnotations" . | nindent 8 }}
        {{- if .Values.linkerd.enabled }}
        config.linkerd.io/proxy-require-identity-on-inbound-ports: "8001"
        config.linkerd.io/default-inbound-policy: "deny"
        {{- end }}
    spec:
      serviceAccountName: auth-service
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
      containers:
      - name: auth-service
        image: {{ include "munshi.authServiceImage" . }}
        imagePullPolicy: {{ .Values.global.imagePullPolicy }}
        ports:
        - containerPort: 8001
          name: http
        env:
        - name: AUTH_DATABASE_URL
          value: "postgresql://auth_user:{{ .Values.secrets.postgres.authPassword }}@postgres-auth:5432/auth_db"
        - name: AUTH_REDIS_URL
          value: "redis://redis-auth:6379/1"
        - name: JWT_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: auth-service-secret
              key: jwt-secret
        {{- range $key, $value := .Values.env.authService }}
        - name: {{ $key }}
          value: {{ $value | quote }}
        {{- end }}
        resources:
          {{- toYaml .Values.resources.authService | nindent 10 }}
        livenessProbe:
          {{- toYaml .Values.healthcheck.authService.livenessProbe | nindent 10 }}
        readinessProbe:
          {{- toYaml .Values.healthcheck.authService.readinessProbe | nindent 10 }}
        securityContext:
          {{- toYaml .Values.securityContext | nindent 10 }}
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: tmp
        emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "munshi.authServiceLabels" . | nindent 4 }}
  annotations:
    {{- if .Values.linkerd.enabled }}
    linkerd.io/inject: {{ .Values.linkerd.inject.default }}
    mirror.linkerd.io/exported: "true"
    {{- end }}
spec:
  type: {{ .Values.services.authService.type }}
  ports:
  - name: http
    port: {{ .Values.services.authService.port }}
    targetPort: 8001
  selector:
    app: auth-service
    {{- include "munshi.selectorLabels" . | nindent 4 }}