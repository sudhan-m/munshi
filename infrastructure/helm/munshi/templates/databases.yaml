# PostgreSQL for Auth Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-auth
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "munshi.labels" . | nindent 4 }}
    app.kubernetes.io/component: database
    database: auth
spec:
  replicas: {{ .Values.replicaCount.postgres }}
  selector:
    matchLabels:
      app: postgres-auth
      {{- include "munshi.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        app: postgres-auth
        {{- include "munshi.labels" . | nindent 8 }}
        app.kubernetes.io/component: database
    spec:
      containers:
      - name: postgres
        image: postgres:15-alpine
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_DB
          value: auth_db
        - name: POSTGRES_USER
          value: auth_user
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-auth-secret
              key: password
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        resources:
          {{- toYaml .Values.resources.postgres | nindent 10 }}
        volumeMounts:
        - name: postgres-data
          mountPath: /var/lib/postgresql/data
        readinessProbe:
          exec:
            command:
              - /bin/sh
              - -c
              - pg_isready -U auth_user -d auth_db
          initialDelaySeconds: 15
          periodSeconds: 5
        livenessProbe:
          exec:
            command:
              - /bin/sh
              - -c
              - pg_isready -U auth_user -d auth_db
          initialDelaySeconds: 30
          periodSeconds: 10
      volumes:
      - name: postgres-data
        emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: postgres-auth
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "munshi.labels" . | nindent 4 }}
    app.kubernetes.io/component: database
spec:
  type: ClusterIP
  ports:
  - port: {{ .Values.services.postgres.port }}
    targetPort: 5432
  selector:
    app: postgres-auth

