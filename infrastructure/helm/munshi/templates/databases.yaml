---
# Redis for Auth Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-auth
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "munshi.labels" . | nindent 4 }}
    app.kubernetes.io/component: cache
    cache: auth
spec:
  replicas: {{ .Values.replicaCount.redis }}
  selector:
    matchLabels:
      app: redis-auth
      {{- include "munshi.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        app: redis-auth
        {{- include "munshi.labels" . | nindent 8 }}
        app.kubernetes.io/component: cache
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        ports:
        - containerPort: 6379
        command:
          - redis-server
          - --appendonly
          - "yes"
        resources:
          {{- toYaml .Values.resources.redis | nindent 10 }}
        volumeMounts:
        - name: redis-data
          mountPath: /data
        readinessProbe:
          exec:
            command:
              - redis-cli
              - ping
          initialDelaySeconds: 5
          periodSeconds: 5
        livenessProbe:
          exec:
            command:
              - redis-cli
              - ping
          initialDelaySeconds: 10
          periodSeconds: 10
      volumes:
      - name: redis-data
        emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: redis-auth
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "munshi.labels" . | nindent 4 }}
    app.kubernetes.io/component: cache
spec:
  type: ClusterIP
  ports:
  - port: {{ .Values.services.redis.port }}
    targetPort: 6379
  selector:
    app: redis-auth

