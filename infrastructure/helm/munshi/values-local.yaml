# Local development values
# Override default values for local Docker Desktop development

# Global settings for local development
global:
  imageRegistry: ""
  imagePullPolicy: Never

# Environment
environment: development
namespace: munshi-dev

# Replica counts (reduced for local development)
replicaCount:
  apiGateway: 1
  authService: 1
  postgres: 1
  redis: 1

# Reduced resource requirements for local development
resources:
  apiGateway:
    requests:
      memory: "128Mi"
      cpu: "50m"
    limits:
      memory: "256Mi"
      cpu: "200m"
  authService:
    requests:
      memory: "64Mi"
      cpu: "25m"
    limits:
      memory: "128Mi"
      cpu: "100m"
  postgres:
    requests:
      memory: "128Mi"
      cpu: "50m"
    limits:
      memory: "256Mi"
      cpu: "150m"
  redis:
    requests:
      memory: "32Mi"
      cpu: "25m"
    limits:
      memory: "64Mi"
      cpu: "50m"

# Development environment variables
env:
  apiGateway:
    ENVIRONMENT: "development"
    DEBUG: "true"
    GATEWAY_HOST: "0.0.0.0"
    GATEWAY_PORT: "8000"
    RATE_LIMIT_ENABLED: "false"  # Disable for easier development
    JWT_VERIFICATION_ENABLED: "true"
    CIRCUIT_BREAKER_ENABLED: "false"  # Disable for easier development
  authService:
    ENVIRONMENT: "development"
    DEBUG: "true"
    AUTH_SERVICE_HOST: "0.0.0.0"
    AUTH_SERVICE_PORT: "8001"

# Linkerd service mesh for local development
linkerd:
  enabled: true
  controlPlane:
    identity:
      issuer:
        crtExpiry: 2160h
    proxy:
      resources:
        cpu:
          request: "10m"
          limit: "100m"
        memory:
          request: "20Mi"
          limit: "50Mi"
  viz:
    enabled: true
    dashboard:
      enabled: true
    prometheus:
      enabled: true
    grafana:
      enabled: false  # Skip Grafana for local development
  inject:
    default: enabled

# Monitoring disabled for local development
monitoring:
  enabled: false

# Development secrets (not for production!)
secrets:
  jwtSecret: "dev_jwt_secret_key_not_for_production"
  postgres:
    authPassword: "dev_auth_password"
    gatewayPassword: "dev_gateway_password"