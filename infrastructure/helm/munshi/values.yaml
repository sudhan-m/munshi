# Default values for Munshi microservices
# This is a YAML-formatted file.

# Global settings
global:
  imageRegistry: ghcr.io/your-username
  imagePullPolicy: IfNotPresent

# Environment
environment: production
namespace: munshi-prod

# Images
images:
  apiGateway:
    repository: munshi/api-gateway
    tag: latest
  authService:
    repository: munshi/auth-service
    tag: latest

# Replica counts
replicaCount:
  apiGateway: 3
  authService: 2
  postgres: 1
  redis: 1

# Resources
resources:
  apiGateway:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "400m"
  authService:
    requests:
      memory: "128Mi"
      cpu: "50m"
    limits:
      memory: "256Mi"
      cpu: "200m"
  postgres:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "300m"
  redis:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "128Mi"
      cpu: "100m"

# Service configuration
services:
  apiGateway:
    type: ClusterIP
    port: 8000
  authService:
    type: ClusterIP
    port: 8001
  postgres:
    port: 5432
  redis:
    port: 6379

# Environment variables
env:
  apiGateway:
    ENVIRONMENT: "production"
    DEBUG: "false"
    GATEWAY_HOST: "0.0.0.0"
    GATEWAY_PORT: "8000"
    RATE_LIMIT_ENABLED: "true"
    DEFAULT_RATE_LIMIT_REQUESTS: "1000"
    AUTHENTICATED_RATE_LIMIT_REQUESTS: "5000"
    JWT_VERIFICATION_ENABLED: "true"
    CIRCUIT_BREAKER_ENABLED: "true"
  authService:
    ENVIRONMENT: "production"
    DEBUG: "false"
    AUTH_SERVICE_HOST: "0.0.0.0"
    AUTH_SERVICE_PORT: "8001"

# Security
securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# Secrets
secrets:
  jwtSecret: "auth_service_production_secret_key_change_this"
  postgres:
    authPassword: "auth_password"
    gatewayPassword: "gateway_password"

# Health checks
healthcheck:
  apiGateway:
    livenessProbe:
      httpGet:
        path: /health
        port: 8000
      initialDelaySeconds: 30
      periodSeconds: 10
    readinessProbe:
      httpGet:
        path: /health
        port: 8000
      initialDelaySeconds: 5
      periodSeconds: 5
  authService:
    livenessProbe:
      httpGet:
        path: /health
        port: 8001
      initialDelaySeconds: 30
      periodSeconds: 10
    readinessProbe:
      httpGet:
        path: /health
        port: 8001
      initialDelaySeconds: 5
      periodSeconds: 5

# Ingress
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: munshi.local
      paths:
        - path: /
          pathType: Prefix
          service: api-gateway
  tls: []

# Linkerd service mesh
linkerd:
  enabled: true
  controlPlane:
    # Linkerd control plane configuration
    identity:
      issuer:
        # Certificate expiration (90 days)
        crtExpiry: 2160h
    proxy:
      resources:
        cpu:
          request: "20m"
          limit: "200m"
        memory:
          request: "30Mi"
          limit: "100Mi"
  viz:
    enabled: true
    # Visualization dashboard for observability
    dashboard:
      enabled: true
      externalUrl: ""
    prometheus:
      enabled: true
    grafana:
      enabled: true
  inject:
    # Default injection policy for namespaces
    default: enabled

# Monitoring
monitoring:
  enabled: false
  prometheus:
    enabled: false
  grafana:
    enabled: false