apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: munshi
  annotations:
    linkerd.io/inject: enabled
    # Enable automatic mTLS with Linkerd
    config.linkerd.io/proxy-require-identity-on-inbound-ports: "8001"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auth-service
      version: v1
  template:
    metadata:
      labels:
        app: auth-service
        version: v1
      annotations:
        linkerd.io/inject: enabled
        # Linkerd sidecar configuration
        config.linkerd.io/proxy-cpu-request: "10m"
        config.linkerd.io/proxy-memory-request: "20Mi"
        config.linkerd.io/proxy-cpu-limit: "100m"
        config.linkerd.io/proxy-memory-limit: "50Mi"
    spec:
      containers:
      - name: auth-service
        image: munshi/auth-service:latest
        ports:
        - containerPort: 8001
          name: http
        env:
        - name: AUTH_DATABASE_URL
          value: "postgresql://auth_user:auth_password@postgres-auth:5432/auth_db"
        - name: AUTH_REDIS_URL
          value: "redis://redis-auth:6379/1"
        - name: JWT_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: auth-service-secret
              key: jwt-secret
        - name: ENVIRONMENT
          value: "production"
        - name: DEBUG
          value: "false"
        - name: AUTH_SERVICE_HOST
          value: "0.0.0.0"
        - name: AUTH_SERVICE_PORT
          value: "8001"
        resources:
          requests:
            memory: "128Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8001
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8001
          initialDelaySeconds: 5
          periodSeconds: 5
        # Security context for minimal privileges
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: tmp
        emptyDir: {}
      # Service account for Linkerd identity
      serviceAccountName: auth-service
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: munshi
  annotations:
    linkerd.io/inject: enabled
    # Enable Linkerd service profile
    mirror.linkerd.io/exported: "true"
spec:
  selector:
    app: auth-service
  ports:
  - name: http
    port: 8001
    targetPort: 8001
  type: ClusterIP
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: auth-service
  namespace: munshi
---
apiVersion: v1
kind: Secret
metadata:
  name: auth-service-secret
  namespace: munshi
type: Opaque
data:
  jwt-secret: YXV0aF9zZXJ2aWNlX3Byb2R1Y3Rpb25fc2VjcmV0X2tleV9jaGFuZ2VfdGhpcw== # base64 encoded JWT secret