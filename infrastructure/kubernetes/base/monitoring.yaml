# Monitoring configuration for Linkerd and application metrics
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: munshi
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
    
    rule_files:
      - "linkerd.rules.yml"
    
    scrape_configs:
    # Linkerd proxy metrics
    - job_name: 'linkerd-proxy'
      kubernetes_sd_configs:
      - role: pod
        namespaces:
          names: ['munshi']
      relabel_configs:
      - source_labels: [__meta_kubernetes_pod_container_name]
        action: keep
        regex: ^linkerd-proxy$
      - source_labels: [__meta_kubernetes_pod_container_port_name]
        action: keep
        regex: ^linkerd-admin$
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod
    
    # Application metrics
    - job_name: 'munshi-apps'
      kubernetes_sd_configs:
      - role: pod
        namespaces:
          names: ['munshi']
      relabel_configs:
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
        action: keep
        regex: true
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
        action: replace
        target_label: __metrics_path__
        regex: (.+)
      - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
        action: replace
        regex: ([^:]+)(?::\d+)?;(\d+)
        replacement: $1:$2
        target_label: __address__
      - action: labelmap
        regex: __meta_kubernetes_pod_label_(.+)
      - source_labels: [__meta_kubernetes_namespace]
        action: replace
        target_label: kubernetes_namespace
      - source_labels: [__meta_kubernetes_pod_name]
        action: replace
        target_label: kubernetes_pod_name
    
    # Redis metrics
    - job_name: 'redis'
      static_configs:
      - targets: ['redis-auth:6379', 'redis-gateway:6379']
    
    # PostgreSQL metrics
    - job_name: 'postgres'
      static_configs:
      - targets: ['postgres-auth:5432', 'postgres-gateway:5432']
    
  linkerd.rules.yml: |
    groups:
    - name: linkerd
      rules:
      - alert: LinkerdHighErrorRate
        expr: sum(rate(response_total{classification="failure"}[5m])) / sum(rate(response_total[5m])) > 0.1
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "High error rate detected"
          description: "Error rate is above 10% for {{ $labels.job }}"
      
      - alert: LinkerdHighLatency
        expr: histogram_quantile(0.99, sum(rate(response_latency_ms_bucket[5m])) by (le)) > 1000
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High latency detected"
          description: "99th percentile latency is above 1000ms for {{ $labels.job }}"
---
# Grafana dashboards for Linkerd and application monitoring
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: munshi
  labels:
    grafana_dashboard: "1"
data:
  linkerd-dashboard.json: |
    {
      "dashboard": {
        "id": null,
        "title": "Munshi Microservices - Linkerd Overview",
        "tags": ["linkerd", "munshi"],
        "style": "dark",
        "timezone": "browser",
        "panels": [
          {
            "id": 1,
            "title": "Success Rate",
            "type": "stat",
            "targets": [
              {
                "expr": "sum(rate(response_total{classification=\"success\",namespace=\"munshi\"}[5m])) / sum(rate(response_total{namespace=\"munshi\"}[5m]))",
                "legendFormat": "Success Rate"
              }
            ],
            "fieldConfig": {
              "defaults": {
                "unit": "percentunit",
                "min": 0,
                "max": 1
              }
            }
          },
          {
            "id": 2,
            "title": "Request Rate",
            "type": "graph",
            "targets": [
              {
                "expr": "sum(rate(response_total{namespace=\"munshi\"}[5m])) by (dst_service_name)",
                "legendFormat": "{{ dst_service_name }}"
              }
            ]
          },
          {
            "id": 3,
            "title": "Latency P99",
            "type": "graph",
            "targets": [
              {
                "expr": "histogram_quantile(0.99, sum(rate(response_latency_ms_bucket{namespace=\"munshi\"}[5m])) by (le, dst_service_name))",
                "legendFormat": "{{ dst_service_name }} P99"
              }
            ]
          }
        ]
      }
    }