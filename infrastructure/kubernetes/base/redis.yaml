apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-auth
  namespace: munshi
  annotations:
    linkerd.io/inject: enabled
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis-auth
      version: v1
  template:
    metadata:
      labels:
        app: redis-auth
        version: v1
      annotations:
        linkerd.io/inject: enabled
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        ports:
        - containerPort: 6379
          name: redis
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "200m"
        volumeMounts:
        - name: redis-data
          mountPath: /data
      volumes:
      - name: redis-data
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: redis-auth
  namespace: munshi
  annotations:
    # Enable Linkerd service profile for advanced traffic management
    linkerd.io/inject: enabled
spec:
  selector:
    app: redis-auth
  ports:
  - name: redis
    port: 6379
    targetPort: 6379
  type: ClusterIP