apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: munshi
  annotations:
    linkerd.io/inject: enabled
    # Enable automatic mTLS with Linkerd
    config.linkerd.io/proxy-require-identity-on-inbound-ports: "8000"
spec:
  replicas: 3
  selector:
    matchLabels:
      app: api-gateway
      version: v1
  template:
    metadata:
      labels:
        app: api-gateway
        version: v1
      annotations:
        linkerd.io/inject: enabled
        # Linkerd sidecar configuration
        config.linkerd.io/proxy-cpu-request: "20m"
        config.linkerd.io/proxy-memory-request: "30Mi"
        config.linkerd.io/proxy-cpu-limit: "200m"
        config.linkerd.io/proxy-memory-limit: "100Mi"
    spec:
      containers:
      - name: api-gateway
        image: munshi/api-gateway:latest
        ports:
        - containerPort: 8000
          name: http
        env:
        - name: GATEWAY_DATABASE_URL
          value: "postgresql://gateway_user:gateway_password@postgres-gateway:5432/gateway_db"
        - name: GATEWAY_REDIS_URL
          value: "redis://redis-gateway:6379/0"
        - name: AUTH_SERVICE_URL
          # Use Linkerd service discovery - automatic mTLS
          value: "http://auth-service.munshi.svc.cluster.local:8001"
        - name: ENVIRONMENT
          value: "production"
        - name: DEBUG
          value: "false"
        - name: GATEWAY_HOST
          value: "0.0.0.0"
        - name: GATEWAY_PORT
          value: "8000"
        - name: RATE_LIMIT_ENABLED
          value: "true"
        - name: DEFAULT_RATE_LIMIT_REQUESTS
          value: "1000"
        - name: AUTHENTICATED_RATE_LIMIT_REQUESTS
          value: "5000"
        - name: JWT_VERIFICATION_ENABLED
          value: "true"
        - name: CIRCUIT_BREAKER_ENABLED
          value: "true"
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "400m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
        # Security context for minimal privileges
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: tmp
        emptyDir: {}
      # Service account for Linkerd identity
      serviceAccountName: api-gateway
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: munshi
  annotations:
    linkerd.io/inject: enabled
    # Enable Linkerd service profile
    mirror.linkerd.io/exported: "true"
spec:
  selector:
    app: api-gateway
  ports:
  - name: http
    port: 8000
    targetPort: 8000
  type: ClusterIP
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: api-gateway
  namespace: munshi