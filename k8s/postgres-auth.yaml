apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-auth
  namespace: munshi
  annotations:
    linkerd.io/inject: enabled
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres-auth
      version: v1
  template:
    metadata:
      labels:
        app: postgres-auth
        version: v1
      annotations:
        linkerd.io/inject: enabled
    spec:
      containers:
      - name: postgres
        image: postgres:15
        env:
        - name: POSTGRES_DB
          value: "auth_db"
        - name: POSTGRES_USER
          value: "auth_user"
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-auth-secret
              key: password
        ports:
        - containerPort: 5432
          name: postgres
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "200m"
        volumeMounts:
        - name: postgres-data
          mountPath: /var/lib/postgresql/data
        livenessProbe:
          exec:
            command:
              - pg_isready
              - -U
              - auth_user
              - -d
              - auth_db
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          exec:
            command:
              - pg_isready
              - -U
              - auth_user
              - -d
              - auth_db
          initialDelaySeconds: 5
          periodSeconds: 5
      volumes:
      - name: postgres-data
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-auth
  namespace: munshi
  annotations:
    linkerd.io/inject: enabled
spec:
  selector:
    app: postgres-auth
  ports:
  - name: postgres
    port: 5432
    targetPort: 5432
  type: ClusterIP
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-auth-secret
  namespace: munshi
type: Opaque
data:
  password: YXV0aF9wYXNzd29yZA== # base64 encoded "auth_password"