# Cloud Build configuration for ASR service with GCP optimizations
steps:
  # Build the Docker image with GPU support and GCP optimizations
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '--build-arg=GPU_SUPPORT=${_GPU_SUPPORT}'
      - '--cache-from=${_IMAGE_NAME}:latest'
      - '--tag=${_IMAGE_NAME}:${SHORT_SHA}'
      - '--tag=${_IMAGE_NAME}:latest'
      - '.'
    env:
      - 'DOCKER_BUILDKIT=1'
    
  # Push the image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', '${_IMAGE_NAME}:${SHORT_SHA}']
    
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', '${_IMAGE_NAME}:latest']

# Optimized build configuration
options:
  # Use high-performance machine for faster builds
  machine_type: 'E2_HIGHCPU_8'
  disk_size_gb: 100
  
  # Enable build caching
  substitution_option: 'ALLOW_LOOSE'
  
  # Use optimized pool for ML workloads
  pool:
    name: 'projects/${PROJECT_ID}/locations/${_REGION}/workerPools/ml-optimized-pool'
  
  # Enable logging
  logging: CLOUD_LOGGING_ONLY

# Build substitutions
substitutions:
  _GPU_SUPPORT: 'gpu'
  _IMAGE_NAME: 'us-central1-docker.pkg.dev/${PROJECT_ID}/munshi-containers/munshi-asr-service'
  _REGION: 'us-central1'

# Timeout for large ML image builds
timeout: '1200s'

# Images to be produced
images:
  - '${_IMAGE_NAME}:${SHORT_SHA}'
  - '${_IMAGE_NAME}:latest'