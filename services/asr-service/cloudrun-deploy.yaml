apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: asr-service
  annotations:
    # Cloud Run specific annotations
    run.googleapis.com/ingress: all
    run.googleapis.com/execution-environment: gen2
spec:
  template:
    metadata:
      annotations:
        # Resource allocation optimized for ASR workload
        run.googleapis.com/memory: "4Gi"
        run.googleapis.com/cpu: "2"
        run.googleapis.com/max-scale: "10"
        run.googleapis.com/min-scale: "0"  # Scale to zero for cost optimization
        
        # Timeout for model loading + inference
        run.googleapis.com/timeout: "900s"  # 15 minutes for cold starts
        
        # CPU allocation during request processing only
        run.googleapis.com/cpu-throttling: "false"
        
        # Cloud SQL connection if needed
        # run.googleapis.com/cloudsql-instances: PROJECT_ID:REGION:INSTANCE_NAME
    spec:
      containerConcurrency: 1  # Process one request at a time for memory efficiency
      timeoutSeconds: 900  # 15 minute timeout
      serviceAccountName: asr-service-sa  # Service account with appropriate permissions
      containers:
      - name: asr-service
        image: gcr.io/PROJECT_ID/asr-service:latest
        ports:
        - name: http1
          containerPort: 8080
        env:
        - name: CLOUD_RUN_MODE
          value: "true"
        - name: FALLBACK_MODE  
          value: "true"
        - name: GPU_SUPPORT
          value: "cpu"
        - name: MODEL_CACHE_SIZE
          value: "1"
        - name: PORT
          value: "8080"
        - name: PYTHONUNBUFFERED
          value: "1"
        - name: LOG_LEVEL
          value: "info"
        
        # Resource limits
        resources:
          limits:
            memory: "4Gi"
            cpu: "2000m"
          requests:
            memory: "2Gi"
            cpu: "1000m"
            
        # Health checks
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 120  # Wait for model loading
          periodSeconds: 60
          timeoutSeconds: 10
          failureThreshold: 3
          
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        
        # Volume mounts for temporary files
        volumeMounts:
        - name: tmp-volume
          mountPath: /tmp
          
      volumes:
      - name: tmp-volume
        emptyDir:
          sizeLimit: "1Gi"
  traffic:
  - percent: 100
    latestRevision: true