# GKE GPU Node Pool Configuration
# Use with: gcloud container node-pools create
apiVersion: v1
kind: ConfigMap
metadata:
  name: gpu-nodepool-config
  namespace: kube-system
data:
  # GKE GPU Node Pool creation script
  create-nodepool.sh: |
    #!/bin/bash
    
    PROJECT_ID=${PROJECT_ID:-"your-project-id"}
    CLUSTER_NAME=${CLUSTER_NAME:-"munshi-cluster"}
    ZONE=${ZONE:-"us-central1-a"}
    REGION=${REGION:-"us-central1"}
    
    # Create GPU node pool for ASR workloads
    gcloud container node-pools create asr-gpu-pool \
        --cluster=$CLUSTER_NAME \
        --zone=$ZONE \
        --machine-type=n1-standard-4 \
        --accelerator=type=nvidia-tesla-t4,count=1 \
        --num-nodes=0 \
        --min-nodes=0 \
        --max-nodes=3 \
        --enable-autoscaling \
        --enable-autorepair \
        --enable-autoupgrade \
        --disk-size=100GB \
        --disk-type=pd-ssd \
        --image-type=cos_containerd \
        --node-taints=nvidia.com/gpu=:NoSchedule \
        --node-labels=workload=gpu,app=asr-service \
        --metadata=disable-legacy-endpoints=true \
        --scopes=https://www.googleapis.com/auth/cloud-platform
    
    # Install NVIDIA GPU drivers
    kubectl apply -f https://raw.githubusercontent.com/GoogleCloudPlatform/container-engine-accelerators/master/nvidia-driver-installer/cos/daemonset-preloaded.yaml

---
# Alternative: Terraform configuration for GPU node pool
apiVersion: v1
kind: ConfigMap
metadata:
  name: gpu-nodepool-terraform
  namespace: kube-system
data:
  main.tf: |
    resource "google_container_node_pool" "asr_gpu_pool" {
      name       = "asr-gpu-pool"
      cluster    = var.cluster_name
      location   = var.zone
      
      # Scale to zero for cost optimization
      initial_node_count = 0
      
      autoscaling {
        min_node_count = 0
        max_node_count = 3
      }
      
      node_config {
        machine_type = "n1-standard-4"
        
        # GPU configuration
        guest_accelerator {
          type  = "nvidia-tesla-t4"
          count = 1
        }
        
        # Optimize for GPU workloads
        disk_size_gb = 100
        disk_type    = "pd-ssd"
        image_type   = "cos_containerd"
        
        # Taints to ensure only GPU workloads are scheduled
        taint {
          key    = "nvidia.com/gpu"
          value  = ""
          effect = "NO_SCHEDULE"
        }
        
        # Labels for pod scheduling
        labels = {
          workload     = "gpu"
          app          = "asr-service"
          accelerator  = "nvidia-tesla-t4"
        }
        
        metadata = {
          disable-legacy-endpoints = "true"
        }
        
        oauth_scopes = [
          "https://www.googleapis.com/auth/cloud-platform"
        ]
      }
      
      management {
        auto_repair  = true
        auto_upgrade = true
      }
      
      upgrade_settings {
        max_surge       = 1
        max_unavailable = 0
      }
    }

---
# AWS EKS GPU Node Group (alternative)
apiVersion: v1
kind: ConfigMap
metadata:
  name: eks-gpu-nodegroup
  namespace: kube-system
data:
  nodegroup.yaml: |
    apiVersion: eksctl.io/v1alpha5
    kind: ClusterConfig
    
    metadata:
      name: munshi-cluster
      region: us-west-2
    
    nodeGroups:
    - name: asr-gpu-workers
      instanceType: g4dn.xlarge  # NVIDIA T4 GPU instance
      minSize: 0
      maxSize: 3
      desiredCapacity: 0
      
      # Volume configuration
      volumeSize: 100
      volumeType: gp3
      
      # GPU-specific settings
      ami: auto
      amiFamily: AmazonLinux2
      
      # Taints for GPU nodes
      taints:
      - key: nvidia.com/gpu
        value: ""
        effect: NoSchedule
      
      # Labels
      labels:
        workload: gpu
        app: asr-service
        accelerator: nvidia-t4
      
      # IAM permissions
      iam:
        withAddonPolicies:
          imageBuilder: true
          autoScaler: true
          cloudWatch: true
      
      # Scaling configuration
      scaling:
        mode: "Auto"
        scaleDownDelayAfterAdd: "10m"
        scaleDownUnneededTime: "2m"

---
# Azure AKS GPU Node Pool
apiVersion: v1
kind: ConfigMap
metadata:
  name: aks-gpu-nodepool
  namespace: kube-system
data:
  create-nodepool.sh: |
    #!/bin/bash
    
    RESOURCE_GROUP=${RESOURCE_GROUP:-"munshi-rg"}
    CLUSTER_NAME=${CLUSTER_NAME:-"munshi-cluster"}
    
    # Create GPU node pool
    az aks nodepool add \
        --resource-group $RESOURCE_GROUP \
        --cluster-name $CLUSTER_NAME \
        --name asrgpupool \
        --node-vm-size Standard_NC6s_v3 \
        --node-count 0 \
        --min-count 0 \
        --max-count 3 \
        --enable-cluster-autoscaler \
        --node-taints nvidia.com/gpu=:NoSchedule \
        --labels workload=gpu,app=asr-service \
        --os-disk-size-gb 100 \
        --os-disk-type Managed

---
# GPU Node Pool monitoring and metrics
apiVersion: v1
kind: ConfigMap
metadata:
  name: gpu-monitoring
  namespace: kube-system
data:
  # NVIDIA GPU metrics collection
  gpu-metrics.yaml: |
    apiVersion: apps/v1
    kind: DaemonSet
    metadata:
      name: nvidia-gpu-metrics
      namespace: kube-system
    spec:
      selector:
        matchLabels:
          name: nvidia-gpu-metrics
      template:
        metadata:
          labels:
            name: nvidia-gpu-metrics
        spec:
          hostPID: true
          nodeSelector:
            accelerator: nvidia-tesla-t4
          containers:
          - name: nvidia-gpu-metrics
            image: nvidia/dcgm-exporter:latest
            ports:
            - name: metrics
              containerPort: 9400
            securityContext:
              privileged: true
            volumeMounts:
            - name: nvidia-install-dir-host
              mountPath: /usr/local/nvidia
              readOnly: true
          volumes:
          - name: nvidia-install-dir-host
            hostPath:
              path: /home/kubernetes/bin/nvidia
          tolerations:
          - key: nvidia.com/gpu
            operator: Exists
            effect: NoSchedule