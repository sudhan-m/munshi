apiVersion: apps/v1
kind: Deployment
metadata:
  name: asr-service-gpu
  namespace: default
  labels:
    app: asr-service-gpu
    version: v1
spec:
  replicas: 0  # Start with 0 replicas for scale-to-zero
  selector:
    matchLabels:
      app: asr-service-gpu
  template:
    metadata:
      labels:
        app: asr-service-gpu
        version: v1
      annotations:
        # Linkerd annotations if using service mesh
        linkerd.io/inject: enabled
    spec:
      # GPU node selector
      nodeSelector:
        accelerator: nvidia-tesla-t4  # or nvidia-tesla-v100, nvidia-tesla-k80
      
      # Toleration for GPU nodes (if using taints)
      tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule
      
      containers:
      - name: asr-service
        image: gcr.io/PROJECT_ID/asr-service-gpu:latest
        ports:
        - name: http
          containerPort: 8004
          protocol: TCP
        
        env:
        - name: CLOUD_RUN_MODE
          value: "false"
        - name: FALLBACK_MODE
          value: "false"  # Use full GPU models
        - name: GPU_SUPPORT
          value: "cuda"
        - name: MODEL_CACHE_SIZE
          value: "3"  # Cache multiple models in GPU memory
        - name: ASR_SERVICE_PORT
          value: "8004"
        - name: PYTHONUNBUFFERED
          value: "1"
        - name: CUDA_VISIBLE_DEVICES
          value: "0"
        
        # Resource requirements for GPU
        resources:
          requests:
            memory: "8Gi"
            cpu: "2000m"
            nvidia.com/gpu: 1
          limits:
            memory: "16Gi"
            cpu: "4000m"
            nvidia.com/gpu: 1
        
        # Health checks
        livenessProbe:
          httpGet:
            path: /health
            port: 8004
          initialDelaySeconds: 180  # Longer delay for GPU model loading
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        
        readinessProbe:
          httpGet:
            path: /health
            port: 8004
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        
        # Startup probe for initial model loading
        startupProbe:
          httpGet:
            path: /health
            port: 8004
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 10  # Allow 5 minutes for startup
        
        # Volume mounts
        volumeMounts:
        - name: tmp-volume
          mountPath: /tmp
        - name: model-cache
          mountPath: /root/.cache
        
      volumes:
      - name: tmp-volume
        emptyDir:
          sizeLimit: "2Gi"
      - name: model-cache
        emptyDir:
          sizeLimit: "10Gi"
      
      # Faster container startup
      terminationGracePeriodSeconds: 30
      
      # Security context
      securityContext:
        runAsNonRoot: false  # GPU access might require root
        fsGroup: 2000

---
apiVersion: v1
kind: Service
metadata:
  name: asr-service-gpu
  labels:
    app: asr-service-gpu
spec:
  type: ClusterIP
  ports:
  - port: 8004
    targetPort: 8004
    protocol: TCP
    name: http
  selector:
    app: asr-service-gpu

---
# Service Monitor for Prometheus (if using)
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: asr-service-gpu
  labels:
    app: asr-service-gpu
spec:
  selector:
    matchLabels:
      app: asr-service-gpu
  endpoints:
  - port: http
    interval: 30s
    path: /health