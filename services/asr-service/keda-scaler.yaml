# KEDA ScaledObject for HTTP-based scaling to zero
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: asr-service-gpu-scaler
  namespace: default
spec:
  scaleTargetRef:
    name: asr-service-gpu
  
  # Scale to zero when no traffic
  minReplicaCount: 0
  maxReplicaCount: 5
  
  # Scale down aggressively to save GPU costs
  pollingInterval: 10   # Check every 10 seconds
  cooldownPeriod: 30    # Wait 30 seconds before scaling down
  idleReplicaCount: 0   # Scale to 0 when idle
  
  triggers:
  # HTTP trigger - scale based on incoming requests
  - type: prometheus
    metadata:
      serverAddress: http://prometheus:9090
      metricName: http_requests_per_second
      threshold: '1'
      query: |
        sum(rate(http_requests_total{job="asr-service-gpu"}[1m]))
  
  # Alternative: Use KEDA HTTP Add-on for direct HTTP scaling
  # - type: http
  #   metadata:
  #     host: asr-service-gpu.default.svc.cluster.local:8004
  #     targetPendingRequests: '1'
  #     scaleDownDelay: '30s'

---
# KEDA TriggerAuthentication for Prometheus (if auth required)
apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: prometheus-auth
  namespace: default
spec:
  # Add auth if your Prometheus requires it
  secretTargetRef:
  - parameter: username
    name: prometheus-secret
    key: username
  - parameter: password
    name: prometheus-secret
    key: password

---
# Alternative: Queue-based scaling (if you implement async processing)
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: asr-service-gpu-queue-scaler
  namespace: default
spec:
  scaleTargetRef:
    name: asr-service-gpu
  
  minReplicaCount: 0
  maxReplicaCount: 3
  
  pollingInterval: 5
  cooldownPeriod: 60
  idleReplicaCount: 0
  
  triggers:
  # Redis queue-based scaling
  - type: redis
    metadata:
      address: redis:6379
      listName: asr_tasks
      listLength: '1'
      enableTLS: 'false'
  
  # Or RabbitMQ queue
  # - type: rabbitmq
  #   metadata:
  #     protocol: amqp
  #     host: rabbitmq.default.svc.cluster.local:5672
  #     queueName: asr-tasks
  #     queueLength: '1'
  #     vhostName: /

---
# HPA as fallback (if KEDA is not available)
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: asr-service-gpu-hpa
  namespace: default
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: asr-service-gpu
  
  minReplicas: 0  # Note: Standard HPA doesn't support 0, need KEDA
  maxReplicas: 5
  
  metrics:
  # CPU-based scaling
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  
  # Memory-based scaling  
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  
  # Custom metrics (requests per second)
  - type: Pods
    pods:
      metric:
        name: http_requests_per_second
      target:
        type: AverageValue
        averageValue: "1"
  
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
      - type: Percent
        value: 100  # Scale up quickly for GPU workloads
        periodSeconds: 15
    scaleDown:
      stabilizationWindowSeconds: 60
      policies:
      - type: Percent
        value: 50   # Scale down more cautiously to avoid thrashing
        periodSeconds: 30