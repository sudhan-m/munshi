# Prometheus monitoring configuration for ASR GPU service
apiVersion: v1
kind: ConfigMap
metadata:
  name: asr-gpu-monitoring
  namespace: default
data:
  # Prometheus scrape configuration
  prometheus-config.yaml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
    
    scrape_configs:
    - job_name: 'asr-service-gpu'
      static_configs:
      - targets: ['asr-service-gpu:8004']
      metrics_path: '/health'
      scrape_interval: 10s
      
    - job_name: 'nvidia-gpu-metrics'
      static_configs:
      - targets: ['nvidia-gpu-metrics:9400']
      scrape_interval: 5s

---
# Custom metrics for scaling decisions
apiVersion: v1
kind: Service
metadata:
  name: asr-gpu-metrics
  labels:
    app: asr-service-gpu
    component: metrics
spec:
  type: ClusterIP
  ports:
  - port: 9090
    targetPort: 9090
    name: metrics
  selector:
    app: asr-service-gpu

---
# Grafana dashboard configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: asr-gpu-dashboard
  namespace: default
data:
  dashboard.json: |
    {
      "dashboard": {
        "id": null,
        "title": "ASR GPU Service Monitoring",
        "tags": ["asr", "gpu", "kubernetes"],
        "timezone": "browser",
        "panels": [
          {
            "id": 1,
            "title": "Request Rate",
            "type": "stat",
            "targets": [
              {
                "expr": "rate(http_requests_total{job=\"asr-service-gpu\"}[5m])",
                "legendFormat": "Requests/sec"
              }
            ]
          },
          {
            "id": 2,
            "title": "GPU Utilization",
            "type": "graph",
            "targets": [
              {
                "expr": "DCGM_FI_DEV_GPU_UTIL",
                "legendFormat": "GPU {{instance}}"
              }
            ]
          },
          {
            "id": 3,
            "title": "GPU Memory Usage",
            "type": "graph",
            "targets": [
              {
                "expr": "DCGM_FI_DEV_FB_USED / DCGM_FI_DEV_FB_TOTAL * 100",
                "legendFormat": "GPU Memory {{instance}}"
              }
            ]
          },
          {
            "id": 4,
            "title": "Pod Replicas",
            "type": "stat",
            "targets": [
              {
                "expr": "kube_deployment_status_replicas{deployment=\"asr-service-gpu\"}",
                "legendFormat": "Active Replicas"
              }
            ]
          },
          {
            "id": 5,
            "title": "Response Time",
            "type": "graph",
            "targets": [
              {
                "expr": "histogram_quantile(0.95, rate(http_request_duration_seconds_bucket{job=\"asr-service-gpu\"}[5m]))",
                "legendFormat": "95th percentile"
              }
            ]
          }
        ],
        "time": {
          "from": "now-1h",
          "to": "now"
        },
        "refresh": "5s"
      }
    }

---
# Alerting rules for GPU service
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: asr-gpu-alerts
  namespace: default
  labels:
    app: asr-service-gpu
spec:
  groups:
  - name: asr-gpu.rules
    rules:
    # High GPU utilization alert
    - alert: HighGPUUtilization
      expr: DCGM_FI_DEV_GPU_UTIL > 90
      for: 5m
      labels:
        severity: warning
        service: asr-gpu
      annotations:
        summary: "High GPU utilization detected"
        description: "GPU utilization is {{ $value }}% for more than 5 minutes"
    
    # GPU memory pressure
    - alert: HighGPUMemoryUsage
      expr: (DCGM_FI_DEV_FB_USED / DCGM_FI_DEV_FB_TOTAL) * 100 > 85
      for: 2m
      labels:
        severity: warning
        service: asr-gpu
      annotations:
        summary: "High GPU memory usage"
        description: "GPU memory usage is {{ $value }}%"
    
    # Service down alert
    - alert: ASRServiceDown
      expr: up{job="asr-service-gpu"} == 0
      for: 1m
      labels:
        severity: critical
        service: asr-gpu
      annotations:
        summary: "ASR GPU service is down"
        description: "ASR GPU service has been down for more than 1 minute"
    
    # High response time
    - alert: HighResponseTime
      expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket{job="asr-service-gpu"}[5m])) > 30
      for: 5m
      labels:
        severity: warning
        service: asr-gpu
      annotations:
        summary: "High response time detected"
        description: "95th percentile response time is {{ $value }}s"
    
    # Scale-to-zero warning (no active pods but requests pending)
    - alert: ScaleToZeroWithPendingRequests
      expr: kube_deployment_status_replicas{deployment="asr-service-gpu"} == 0 and rate(http_requests_total{job="asr-service-gpu"}[1m]) > 0
      for: 30s
      labels:
        severity: warning
        service: asr-gpu
      annotations:
        summary: "Requests pending but no active pods"
        description: "Service scaled to zero but requests are incoming"

---
# NVIDIA GPU monitoring DaemonSet
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: nvidia-dcgm-exporter
  namespace: default
spec:
  selector:
    matchLabels:
      name: nvidia-dcgm-exporter
  template:
    metadata:
      labels:
        name: nvidia-dcgm-exporter
    spec:
      nodeSelector:
        accelerator: nvidia-tesla-t4
      tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule
      containers:
      - name: nvidia-dcgm-exporter
        image: nvcr.io/nvidia/k8s/dcgm-exporter:3.1.8-3.1.5-ubuntu20.04
        ports:
        - name: metrics
          containerPort: 9400
        securityContext:
          privileged: true
        env:
        - name: DCGM_EXPORTER_LISTEN
          value: ":9400"
        - name: DCGM_EXPORTER_KUBERNETES
          value: "true"
        volumeMounts:
        - name: nvidia-install-dir-host
          mountPath: /usr/local/nvidia
          readOnly: true
      volumes:
      - name: nvidia-install-dir-host
        hostPath:
          path: /home/kubernetes/bin/nvidia

---
# Service for NVIDIA GPU metrics
apiVersion: v1
kind: Service
metadata:
  name: nvidia-gpu-metrics
  labels:
    name: nvidia-dcgm-exporter
spec:
  type: ClusterIP
  ports:
  - port: 9400
    targetPort: 9400
    name: metrics
  selector:
    name: nvidia-dcgm-exporter

---
# ServiceMonitor for GPU metrics
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: nvidia-gpu-metrics
  labels:
    name: nvidia-dcgm-exporter
spec:
  selector:
    matchLabels:
      name: nvidia-dcgm-exporter
  endpoints:
  - port: metrics
    interval: 5s
    path: /metrics