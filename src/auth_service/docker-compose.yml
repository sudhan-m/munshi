version: '3.8'

services:
  auth-postgres:
    image: postgres:15
    container_name: auth-postgres
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: auth_user
      POSTGRES_PASSWORD: auth_password
    ports:
      - "5433:5432"
    volumes:
      - auth_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth_user -d auth_db"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - auth-network

  auth-redis:
    image: redis:7-alpine
    container_name: auth-redis
    ports:
      - "6380:6379"
    volumes:
      - auth_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - auth-network

  auth-service:
    build: .
    container_name: auth-service
    expose:
      - "8001"
    environment:
      - AUTH_DATABASE_URL=postgresql://auth_user:auth_password@auth-postgres:5432/auth_db
      - AUTH_REDIS_URL=redis://auth-redis:6379/1
      - JWT_SECRET_KEY=auth_service_production_secret_key_change_this
      - ENVIRONMENT=development
      - DEBUG=true
    depends_on:
      auth-postgres:
        condition: service_healthy
      auth-redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - auth-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  auth-nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: auth-nginx
    ports:
      - "443:443"
      - "80:80"
    environment:
      - ENVIRONMENT=development
    depends_on:
      auth-service:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - auth_nginx_certs:/etc/nginx/certs
      - auth_nginx_logs:/var/log/nginx
    networks:
      - auth-network

volumes:
  auth_postgres_data:
  auth_redis_data:
  auth_nginx_certs:
  auth_nginx_logs:

networks:
  auth-network:
    driver: bridge